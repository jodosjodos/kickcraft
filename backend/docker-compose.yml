services:
  postgres:
    image: postgres:16-alpine
    container_name: kickcraft-postgres
    environment:
      POSTGRES_DB: kickcraft
      POSTGRES_USER: kickcraft
      POSTGRES_PASSWORD: kickcraft
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kickcraft']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kickcraft-redis
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: kickcraft-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kickcraft
      MINIO_ROOT_PASSWORD: kickcraft
    ports:
      - '9200:9000'
      - '9201:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kickcraft-backend
    env_file: .env
    ports:
      - '5006:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
