services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kickcraft
      POSTGRES_USER: kickcraft
      POSTGRES_PASSWORD: kickcraft
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: kickcraft
      MINIO_ROOT_PASSWORD: kickcraft
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
